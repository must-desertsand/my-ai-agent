[project]
name = "haseeb-agent"
version = "0.1.0"
description = "Haseeb's Agent: drafts Slack insights, feedback and post-meeting todos for Haseeb Zafar"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pypdf",
    "starlette==1.7.0",  # pinned (M8): the newest release at least two weeks old on 2026-10-19
    "uvicorn>=0.32",
]

[project.scripts]
haseeb-agent = "haseeb_agent.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haseeb_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
